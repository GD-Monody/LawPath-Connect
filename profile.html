<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 - 律途</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    /* ===== 导航栏 ===== */
    .navbar {
      background: #1a3a5c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 60px;
      height: 64px;
    }

    .navbar .logo {
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .navbar .nav-links a {
      color: #ccd9e6;
      text-decoration: none;
      margin-left: 32px;
      font-size: 14px;
    }

    .navbar .nav-links a:hover {
      color: #fff;
    }

    .navbar .nav-links a.active {
      color: #e8a838;
      font-weight: bold;
    }

    .navbar .btn-register {
      background: #e8a838;
      color: #1a3a5c;
      padding: 8px 20px;
      border-radius: 4px;
      font-weight: bold;
      margin-left: 32px;
    }

    /* ===== 面包屑 ===== */
    .breadcrumb {
      background: #fff;
      padding: 16px 60px;
      font-size: 13px;
      color: #999;
      border-bottom: 1px solid #f0f0f0;
    }

    .breadcrumb a {
      color: #2d6a9f;
      text-decoration: none;
    }

    .breadcrumb span {
      margin: 0 8px;
    }

    /* ===== 主体 ===== */
    .main-content {
      max-width: 950px;
      margin: 24px auto;
      padding: 0 20px 60px;
    }

    /* ===== 用户信息头部 ===== */
    .user-header {
      background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
      border-radius: 12px;
      padding: 32px 36px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .user-header .avatar-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .user-header .info h2 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .user-header .info p {
      font-size: 13px;
      opacity: 0.8;
    }

    .user-header .role-badge {
      background: #e8a838;
      color: #1a3a5c;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ===== 统计小卡片 ===== */
    .mini-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .mini-stat {
      background: #fff;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
    }

    .mini-stat .num {
      font-size: 26px;
      font-weight: bold;
      color: #1a3a5c;
    }

    .mini-stat .label {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    /* ===== 卡片通用 ===== */
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 24px 28px;
      margin-bottom: 20px;
    }

    .card .card-title {
      font-size: 16px;
      font-weight: bold;
      color: #1a3a5c;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
    }

    /* ===== 表单 ===== */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #666;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 13px;
      color: #333;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #1a3a5c;
      outline: none;
    }

    .btn-save {
      background: #1a3a5c;
      color: #fff;
      border: none;
      padding: 10px 28px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-save:hover {
      background: #2d6a9f;
    }

    /* ===== 订单/咨询列表 ===== */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f5f5f5;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .item-row .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-row .item-title {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .item-row .item-meta {
      font-size: 11px;
      color: #bbb;
      margin-top: 2px;
    }

    .item-row .item-status {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 10px;
      font-weight: bold;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .status-pending {
      background: #fef5e7;
      color: #e8a838;
    }

    .status-done {
      background: #edf7ee;
      color: #67c23a;
    }

    .status-progress {
      background: #eef3f8;
      color: #2d6a9f;
    }

    /* ===== 积分展示 ===== */
    .score-display {
      text-align: center;
      padding: 10px 0;
    }

    .score-display .big-score {
      font-size: 48px;
      font-weight: bold;
      color: #67c23a;
    }

    .score-display .score-label {
      font-size: 13px;
      color: #999;
    }

    /* ===== 退出按钮 ===== */
    .btn-logout {
      background: #fff;
      color: #f56c6c;
      border: 1px solid #f56c6c;
      padding: 6px 18px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-logout:hover {
      background: #fef0f0;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #ccc;
      font-size: 13px;
    }

    /* 登录提示 */
    .login-tip {
      text-align: center;
      padding: 80px 20px;
      color: #999;
      font-size: 15px;
    }

    .login-tip a {
      color: #1a3a5c;
      font-weight: bold;
      text-decoration: none;
    }

    /* 隐藏 */
    .hidden {
      display: none;
    }

    /* ===== 底部 ===== */
    .footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #bbb;
      background: #fff;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <div class="navbar">
    <a href="index.html" class="logo">⚖️ 律途</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="lawyer.html">找律师</a>
      <a href="publish.html">案件发布</a>
      <a href="case-pool.html" id="case-pool-entry" style="display:none;">案件池</a>
      <a href="ai-match.html">AI匹配</a>
      <a href="community.html">互助社区</a>
      <a href="knowledge.html">普法知识</a>
      <a href="public-welfare.html">公益咨询</a>
      <a href="admin.html" id="admin-entry" class="admin-link" style="display:none;">后台管理</a>
      <a href="profile.html" id="profile-entry" style="display:none;" class="active">个人主页</a>
      <a href="login.html" class="btn-register" id="nav-user-btn">注册 / 登录</a>
    </div>
  </div>

  <!-- 面包屑 -->
  <div class="breadcrumb">
    <a href="index.html">首页</a>
    <span>›</span>
    个人主页
  </div>

  <!-- 主体 -->
  <div class="main-content" id="main-content"></div>

  <!-- 底部 -->
  <div class="footer">
    © 2025 律途 - 法律服务对接平台 | 参赛作品演示
  </div>

  <script>
    var currentUserStr = localStorage.getItem('faqiao_currentUser');
    var currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
    var userBtn = document.getElementById('nav-user-btn');

    // ========== 导航栏登录状态 ==========
    if (currentUser) {
      userBtn.textContent = '👤 ' + currentUser.phone + ' | 退出';
      userBtn.href = '#';
      userBtn.onclick = function() {
        localStorage.removeItem('faqiao_currentUser');
        alert('已退出登录');
        window.location.href = 'index.html';
      };
    }

    // ========== 渲染页面 ==========
    var container = document.getElementById('main-content');

    if (!currentUser) {
      container.innerHTML =
        '<div class="login-tip">🔒 请先 <a href="login.html">登录</a> 后查看个人主页</div>';
    } else if (currentUser.role === 'lawyer') {
      renderLawyerView();
    } else {
      renderUserView();
    }

    // ========== 律师视图 ==========
    function renderLawyerView() {
      // 读取已保存的个人资料
      var profileStr = localStorage.getItem('faqiao_lawyer_profile_' + currentUser.phone);
      var profile = profileStr ? JSON.parse(profileStr) : {
        tags: '劳动纠纷,合同纠纷',
        intro: '暂无个人简介，点击下方编辑',
        price: '200起'
      };

      var html = '';

      // 头部
      html +=
        '<div class="user-header">' +
          '<div class="avatar-circle">⚖️</div>' +
          '<div class="info">' +
            '<h2>' + currentUser.phone + '</h2>' +
            '<p>执业律师 · 认证已通过</p>' +
          '</div>' +
          '<span class="role-badge">律师</span>' +
        '</div>';

      // 统计卡片
      html +=
        '<div class="mini-stats">' +
          '<div class="mini-stat"><div class="num" id="stat-orders">2</div><div class="label">待处理订单</div></div>' +
          '<div class="mini-stat"><div class="num">15</div><div class="label">已完成服务</div></div>' +
          '<div class="mini-stat"><div class="num">4.9</div><div class="label">用户评分</div></div>' +
          '<div class="mini-stat"><div class="num" id="stat-score">128</div><div class="label">公益积分</div></div>' +
        '</div>';

      // 认证状态（动态读取）
      var certStr = localStorage.getItem('faqiao_cert_' + currentUser.phone);
      var cert = certStr ? JSON.parse(certStr) : null;
      if (cert && cert.status === 'done') {
        html +=
          '<div class="card" style="border-left:4px solid #67c23a;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
              '<div>' +
                '<span style="font-size:15px;font-weight:bold;color:#1a3a5c;">✅ 已通过律师执业认证</span>' +
                '<span style="font-size:11px;color:#999;margin-left:10px;">执业证号已备案</span>' +
              '</div>' +
              '<a href="certification.html" style="font-size:12px;color:#2d6a9f;text-decoration:none;">查看认证详情 →</a>' +
            '</div>' +
          '</div>';
      } else if (cert && cert.status === 'pending') {
        html +=
          '<div class="card" style="border-left:4px solid #e8a838;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
              '<div>' +
                '<span style="font-size:15px;font-weight:bold;color:#e8a838;">⏳ 律师认证审核中</span>' +
                '<span style="font-size:11px;color:#999;margin-left:10px;">预计1-3个工作日</span>' +
              '</div>' +
              '<a href="certification.html" style="font-size:12px;color:#2d6a9f;text-decoration:none;">查看进度 →</a>' +
            '</div>' +
          '</div>';
      } else if (cert && cert.status === 'reject') {
        html +=
          '<div class="card" style="border-left:4px solid #f56c6c;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
              '<div>' +
                '<span style="font-size:15px;font-weight:bold;color:#f56c6c;">❌ 认证未通过</span>' +
                '<span style="font-size:11px;color:#999;margin-left:10px;">请核对信息后重新提交</span>' +
              '</div>' +
              '<a href="certification.html" style="font-size:12px;color:#2d6a9f;text-decoration:none;">重新认证 →</a>' +
            '</div>' +
          '</div>';
      } else {
        html +=
          '<div class="card" style="border-left:4px solid #bbb;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
              '<div>' +
                '<span style="font-size:15px;font-weight:bold;color:#999;">⚪ 尚未完成律师认证</span>' +
                '<span style="font-size:11px;color:#bbb;margin-left:10px;">认证后可对外展示律师主页</span>' +
              '</div>' +
              '<a href="certification.html" style="font-size:12px;color:#2d6a9f;text-decoration:none;">去认证 →</a>' +
            '</div>' +
          '</div>';
      }


      // 编辑个人主页
      html +=
        '<div class="card">' +
          '<div class="card-title">✏️ 编辑个人主页</div>' +
          '<div class="form-group">' +
            '<label>擅长领域（用逗号分隔）</label>' +
            '<input type="text" id="edit-tags" value="' + profile.tags + '" placeholder="如：劳动纠纷,合同纠纷,工伤赔偿">' +
          '</div>' +
          '<div class="form-group">' +
            '<label>个人简介</label>' +
            '<textarea id="edit-intro" placeholder="介绍您的专业背景、执业经验和擅长方向……">' + profile.intro + '</textarea>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>参考服务价格（元/次）</label>' +
            '<input type="text" id="edit-price" value="' + profile.price + '" placeholder="如：200">' +
          '</div>' +
          '<button class="btn-save" onclick="saveProfile()">💾 保存</button>' + 
          '<a href="lawyer-detail.html?self=1" style="margin-left:12px;font-size:12px;color:#2d6a9f;text-decoration:none;">👁️ 预览我的对外主页 →</a>' +
          '<span style="font-size:12px;color:#67c23a;margin-left:12px;display:none;" id="save-ok">✅ 已保存</span>' +
        '</div>';

      // 我的订单（从 localStorage 读取真实订单）
      var ordersStr = localStorage.getItem('faqiao_orders');
      var allOrders = ordersStr ? JSON.parse(ordersStr) : [];
      var myOrders = allOrders.slice(0, 5);

      var demoOrders = [
        { serviceType: '诉讼文书代写 - 劳动仲裁申请书', userName: '打工人小王', servicePrice: '¥800', time: '2025-07-26', status: '待处理' },
        { serviceType: '线上法律咨询 - 试用期辞退问题', userName: '职场新人', servicePrice: '¥200', time: '2025-07-25', status: '进行中' },
        { serviceType: '出庭协助 - 劳动纠纷庭审代理', userName: '刘先生', servicePrice: '¥3000', time: '2025-07-20', status: '已完成' }
      ];

      var displayOrders = myOrders.length > 0 ? myOrders : demoOrders;

      html +=
        '<div class="card">' +
          '<div class="card-title">📋 最近订单</div>';

      displayOrders.forEach(function(o) {
        var statusClass = '';
        if (o.status === '待律师确认' || o.status === '待处理') statusClass = 'status-pending';
        else if (o.status === '进行中') statusClass = 'status-progress';
        else if (o.status === '已完成') statusClass = 'status-done';
        else statusClass = 'status-pending';

        html +=
          '<div class="item-row">' +
            '<div class="item-info">' +
              '<div class="item-title">' + (o.serviceType || '法律服务') + (o.title ? (' - ' + o.title) : '') + '</div>' +
              '<div class="item-meta">用户：' + (o.userName || '匿名') + ' · ' + (o.servicePrice || '--') + ' · ' + (o.time || '') + '</div>' +
            '</div>' +
            '<span class="item-status ' + statusClass + '">' + (o.status || '待处理') + '</span>' +
          '</div>';
      });

      html += '</div>';

      // 公益积分
      html +=
        '<div class="card">' +
          '<div class="card-title">⭐ 公益服务积分</div>' +
          '<div class="score-display">' +
            '<div class="big-score">128</div>' +
            '<div class="score-label">累计公益积分 · 排名前15% · 优先案件推送</div>' +
          '</div>' +
          '<div style="font-size:12px;color:#999;text-align:center;margin-top:8px;">' +
            '社区答疑 56次 + 公益咨询 12次 + 普法科普 3篇' +
          '</div>' +
        '</div>';

      // 退出
      html +=
        '<div style="text-align:center;">' +
          '<button class="btn-logout" onclick="localStorage.removeItem(\'faqiao_currentUser\');alert(\'已退出登录\');window.location.href=\'index.html\';">退出登录</button>' +
        '</div>';

      container.innerHTML = html;
    }

    // ========== 保存律师个人资料 ==========
    function saveProfile() {
      var tags = document.getElementById('edit-tags').value;
      var intro = document.getElementById('edit-intro').value;
      var price = document.getElementById('edit-price').value;

      if (!tags || !intro) {
        alert('请填写擅长领域和个人简介');
        return;
      }

      var profile = {
        tags: tags,
        intro: intro,
        price: price || '未设定',
        updatedAt: new Date().toLocaleString()
      };
      localStorage.setItem('faqiao_lawyer_profile_' + currentUser.phone, JSON.stringify(profile));

      var ok = document.getElementById('save-ok');
      ok.style.display = 'inline';
      setTimeout(function() { ok.style.display = 'none'; }, 2000);
    }

    // ========== 用户视图 ==========
    function renderUserView() {
      // ========== 读取和过滤（必须先于 HTML 生成） ==========
      var casesStr = localStorage.getItem('faqiao_cases');
      var allCases = casesStr ? JSON.parse(casesStr) : [];
      var myCases = allCases.filter(function(c) {
        return c.publisher === currentUser.phone;
      });

      var postsStr = localStorage.getItem('faqiao_posts');
      var allPosts = postsStr ? JSON.parse(postsStr) : [];
      var myPosts = allPosts.filter(function(p) {
        return !p.anonymous && p.author === currentUser.phone;
      });

      var welfaresStr = localStorage.getItem('faqiao_welfares');
      var allWelfares = welfaresStr ? JSON.parse(welfaresStr) : [];
      var myWelfares = allWelfares.filter(function(w) {
        return w.phone === currentUser.phone;
      });

      var ordersStr = localStorage.getItem('faqiao_orders');
      var allOrders = ordersStr ? JSON.parse(ordersStr) : [];
      var myOrders = allOrders.filter(function(o) {
        return o.userPhone === currentUser.phone;
      });
      var lawyerNames = [];
      myOrders.forEach(function(o) {
        if (lawyerNames.indexOf(o.lawyerName) === -1) {
          lawyerNames.push(o.lawyerName);
        }
      });

      // ========== 生成 HTML ==========
      var html = '';

      // 头部
      html +=
        '<div class="user-header">' +
          '<div class="avatar-circle">👤</div>' +
          '<div class="info">' +
            '<h2>' + currentUser.phone + '</h2>' +
            '<p>普通用户 · 已实名认证</p>' +
          '</div>' +
          '<span class="role-badge">用户</span>' +
        '</div>';

      // 统计（现在变量已定义）
      html +=
        '<div class="mini-stats">' +
          '<div class="mini-stat"><div class="num">' + myCases.length + '</div><div class="label">我的案件</div></div>' +
          '<div class="mini-stat"><div class="num">' + myPosts.length + '</div><div class="label">社区帖子</div></div>' +
          '<div class="mini-stat"><div class="num">' + myWelfares.length + '</div><div class="label">公益咨询</div></div>' +
          '<div class="mini-stat"><div class="num">' + lawyerNames.length + '</div><div class="label">对接律师</div></div>' +
        '</div>';

      // 我的案件
      html += '<div class="card"><div class="card-title">📋 我的案件</div>';
      if (myCases.length === 0) {
        html += '<div class="empty-state">暂无案件，<a href="publish.html" style="color:#2d6a9f;">去发布</a></div>';
      } else {
        myCases.slice(0, 5).forEach(function(c) {
          html +=
            '<div class="item-row">' +
              '<div class="item-info">' +
                '<div class="item-title">' + c.title + '</div>' +
                '<div class="item-meta">类型：' + c.type + ' · 预算：' + (c.budgetMin || '--') + '-' + (c.budgetMax || '--') + '元 · ' + (c.time || '') + '</div>' +
              '</div>' +
              '<span class="item-status status-pending">公开中</span>' +
            '</div>';
        });
      }
      html += '</div>';

      // 我的帖子
      html += '<div class="card"><div class="card-title">💬 我的帖子</div>';
      if (myPosts.length === 0) {
        html += '<div class="empty-state">暂无帖子，<a href="community.html" style="color:#2d6a9f;">去发帖</a></div>';
      } else {
        myPosts.slice(0, 5).forEach(function(p) {
          html +=
            '<div class="item-row">' +
              '<div class="item-info">' +
                '<div class="item-title">' + p.title + '</div>' +
                '<div class="item-meta">分类：' + p.category + ' · ' + p.time + ' · ' + p.replies + '条回复</div>' +
              '</div>' +
              '<span class="item-status status-done">已发布</span>' +
            '</div>';
        });
      }
      html += '</div>';

      // 公益咨询
      html += '<div class="card"><div class="card-title">🆓 我的公益咨询</div>';
      if (myWelfares.length === 0) {
        html += '<div class="empty-state">暂无公益咨询，<a href="public-welfare.html" style="color:#2d6a9f;">去提交</a></div>';
      } else {
        myWelfares.slice(0, 5).forEach(function(w) {
          html +=
            '<div class="item-row">' +
              '<div class="item-info">' +
                '<div class="item-title">' + w.title + '</div>' +
                '<div class="item-meta">类型：' + w.type + ' · ' + w.time + '</div>' +
              '</div>' +
              '<span class="item-status status-pending">' + (w.status || '待回复') + '</span>' +
            '</div>';
        });
      }
      html += '</div>';

      // 我的订单
      html += '<div class="card"><div class="card-title">📦 我的订单</div>';
      if (myOrders.length === 0) {
        html += '<div class="empty-state">暂无订单，<a href="lawyer.html" style="color:#2d6a9f;">去找律师</a></div>';
      } else {
        myOrders.slice(0, 5).forEach(function(o) {
          var statusClass = '';
          if (o.status === '待律师确认') statusClass = 'status-pending';
          else if (o.status === '进行中') statusClass = 'status-progress';
          else if (o.status === '已完成') statusClass = 'status-done';
          else statusClass = 'status-pending';

          html +=
            '<div class="item-row">' +
              '<div class="item-info">' +
                '<div class="item-title">' + o.serviceType + (o.title ? (' - ' + o.title) : '') + '</div>' +
                '<div class="item-meta">律师：' + o.lawyerName + ' · ' + o.servicePrice + ' · ' + o.time + '</div>' +
              '</div>' +
              '<span class="item-status ' + statusClass + '">' + o.status + '</span>' +
            '</div>';
        });
      }
      html += '</div>';

      // 退出
      html +=
        '<div style="text-align:center;">' +
          '<button class="btn-logout" onclick="localStorage.removeItem(\'faqiao_currentUser\');alert(\'已退出登录\');window.location.href=\'index.html\';">退出登录</button>' +
        '</div>';

      container.innerHTML = html;
    }

      // ========== 登录后显示隐藏入口 ==========
      if (currentUser) {
        // 显示案件池入口（所有登录用户可见）
        var poolEntry = document.getElementById('case-pool-entry');
        if (poolEntry) poolEntry.style.display = 'inline';

        // 显示个人主页入口
        var profileEntry = document.getElementById('profile-entry');
        if (profileEntry) profileEntry.style.display = 'inline';
      }

      // 管理员模式：显示后台入口
      if (localStorage.getItem('faqiao_adminMode') === 'true') {
        var adminEntry = document.getElementById('admin-entry');
        if (adminEntry) adminEntry.style.display = 'inline';
      }

  </script>

</body>
</html>
