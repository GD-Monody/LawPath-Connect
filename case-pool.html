  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    /* ===== 导航栏 ===== */

    /* ===== 面包屑 ===== */

    /* ===== 页面标题 ===== */
    .page-header {
      background: #fff;
      padding: 24px 60px 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .page-header h2 {
      font-size: 22px;
      color: #1a3a5c;
    }

    .page-header p {
      font-size: 13px;
      color: #999;
      margin-top: 4px;
    }

    /* ===== 筛选栏 ===== */
    .filter-bar {
      background: #fff;
      padding: 16px 60px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .filter-bar select {
      padding: 8px 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      color: #333;
      background: #fff;
      cursor: pointer;
    }

    .filter-bar select:focus {
      border-color: #1a3a5c;
      outline: none;
    }

    .filter-bar .btn-reset {
      background: #fff;
      color: #666;
      border: 1px solid #ddd;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ===== 案件列表 ===== */
    .case-list {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .case-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 24px 28px;
      margin-bottom: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .case-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.1);
    }

    .case-card .case-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .case-card .case-title {
      font-size: 17px;
      font-weight: bold;
      color: #1a3a5c;
      margin-bottom: 4px;
    }

    .case-card .case-meta {
      font-size: 12px;
      color: #bbb;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .case-card .case-tags {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .case-card .tag-type {
      background: #eef3f8;
      color: #2d6a9f;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .case-card .tag-privacy {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .tag-public {
      background: #edf7ee;
      color: #67c23a;
    }

    .tag-lawyer-only {
      background: #fef5e7;
      color: #e8a838;
    }

    .case-card .case-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp: 2;
      line-clamp:2;
      overflow: hidden;
    }

    .case-card .case-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #f5f5f5;
    }

    .case-card .case-budget {
      font-size: 14px;
      font-weight: bold;
      color: #e8a838;
    }

    .case-card .btn-contact {
      background: #1a3a5c;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .case-card .btn-contact:hover {
      background: #2d6a9f;
    }

    .case-card .btn-contact.contacted {
      background: #ccc;
      cursor: default;
    }

    .case-card .btn-detail {
      background: #fff;
      color: #2d6a9f;
      border: 1px solid #2d6a9f;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      margin-right: 10px;
    }

    /* ===== 展开详情 ===== */
    .case-detail-expand {
      background: #fafbfc;
      border-radius: 6px;
      padding: 20px;
      margin-top: 14px;
      display: none;
    }

    .case-detail-expand.show {
      display: block;
    }

    .case-detail-expand .detail-row {
      margin-bottom: 12px;
    }

    .case-detail-expand .detail-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 3px;
    }

    .case-detail-expand .detail-value {
      font-size: 14px;
      color: #444;
      line-height: 1.7;
    }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #bbb;
      font-size: 15px;
    }

    /* ===== 底部 ===== */
    
  </style>
</head>

  <script>
    // 全局角色判断
    function checkIsLawyer() {
      var cu = localStorage.getItem('faqiao_currentUser');
      return cu ? JSON.parse(cu).role === 'lawyer' : false;
    }

    // ========== 读取案件 ==========
    function getCases() {
      var casesStr = localStorage.getItem('faqiao_cases');
      return casesStr ? JSON.parse(casesStr) : [];
    }

    // ========== 已联系记录 ==========
    function getContacted() {
      var cStr = localStorage.getItem('faqiao_contacted');
      return cStr ? JSON.parse(cStr) : [];
    }

    function markContacted(caseId) {
      var contacted = getContacted();
      if (contacted.indexOf(caseId) === -1) {
        contacted.push(caseId);
        localStorage.setItem('faqiao_contacted', JSON.stringify(contacted));
      }
    }

    // ========== 渲染 ==========
    function renderCases(cases) {
      var listEl = document.getElementById('case-list');
      var contacted = getContacted();

      if (cases.length === 0) {
        listEl.innerHTML = '<div class="empty-state">📭 暂无符合条件的案件<br><small style="color:#ccc;">尝试调整筛选条件，或等待用户发布新案件</small></div>';
        return;
      }

      var html = '';
      cases.forEach(function(c) {
        var isContacted = contacted.indexOf(c.id) !== -1;
        var privacyTag = '';
        if (c.privacy === 'public') {
          privacyTag = '<span class="tag-privacy tag-public">🌐 公开</span>';
        } else if (c.privacy === 'lawyer-only') {
          privacyTag = '<span class="tag-privacy tag-lawyer-only">⚖️ 仅律师可见</span>';
        }

        html +=
          '<div class="case-card">' +
            '<div class="case-header">' +
              '<div>' +
                '<div class="case-title">' + c.title + '</div>' +
                '<div class="case-meta">' +
                  '<span>👤 ' + (c.publisher || '匿名用户') + '</span>' +
                  '<span>📍 ' + (c.area || '未知') + '</span>' +
                  '<span>🕒 ' + (c.time || '近期') + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="case-tags">' +
                '<span class="tag-type">' + c.type + '</span>' +
                privacyTag +
              '</div>' +
            '</div>' +
            '<div class="case-desc">' + (c.desc || '暂无详细描述') + '</div>' +
            '<div class="case-footer">' +
              '<div class="case-budget">💰 预算：' + (c.budgetMin || '未设定') + ' — ' + (c.budgetMax || '未设定') + ' 元</div>' +
              '<div>' +
                '<button class="btn-detail" onclick="toggleDetail(' + c.id + ')">查看详情</button>' +
                '<button class="btn-contact' + (isContacted ? ' contacted' : '') + '" onclick="contactUser(' + c.id + ', this)"' + (isContacted ? ' disabled' : '') + '>' + (isContacted ? '已联系' : '联系用户') + '</button>' +
              '</div>' +
            '</div>' +
            '<div class="case-detail-expand" id="detail-' + c.id + '">' +
              '<div class="detail-row"><div class="detail-label">案件类型</div><div class="detail-value">' + c.type + '</div></div>' +
              '<div class="detail-row"><div class="detail-label">所在地区</div><div class="detail-value">' + (c.area || '未填写') + '</div></div>' +
              '<div class="detail-row"><div class="detail-label">案件描述</div><div class="detail-value">' + (c.desc || '暂无') + '</div></div>' +
              '<div class="detail-row"><div class="detail-label">用户诉求</div><div class="detail-value">' + (c.demand || '未填写') + '</div></div>' +
              '<div class="detail-row"><div class="detail-label">预算范围</div><div class="detail-value">' + (c.budgetMin || '未设定') + ' — ' + (c.budgetMax || '未设定') + ' 元</div></div>' +
            '</div>' +
          '</div>';
      });
      listEl.innerHTML = html;
    }

    // 角色提示
    (function() {
      var hint = document.getElementById('role-hint');
      if (hint) {
        hint.textContent = checkIsLawyer() ? '🔓 律师模式：可查看公开 + 仅律师可见的案件' : '🔒 普通模式：仅展示公开案件';
      }
    })();

    // ========== 筛选 ==========
    function filterCases() {
      var typeFilter = document.getElementById('filter-type').value;
      var areaFilter = document.getElementById('filter-area').value;

      var isLawyer = checkIsLawyer();
      var allCases = getCases();
      var visible = allCases.filter(function(c) {
        if (c.privacy === 'public') return true;
        if (c.privacy === 'lawyer-only' && isLawyer) return true;
        return false;
      });

      if (typeFilter) {
        visible = visible.filter(function(c) { return c.type === typeFilter; });
      }
      if (areaFilter) {
        visible = visible.filter(function(c) { return c.area === areaFilter; });
      }

      renderCases(visible);
    }

    function resetFilter() {
      document.getElementById('filter-type').value = '';
      document.getElementById('filter-area').value = '';
      filterCases();
    }

    // ========== 展开详情 ==========
    function toggleDetail(caseId) {
      var el = document.getElementById('detail-' + caseId);
      if (el.classList.contains('show')) {
        el.classList.remove('show');
      } else {
        el.classList.add('show');
      }
    }

    // ========== 联系用户 ==========
    function contactUser(caseId, btn) {
      if (confirm('确认联系该用户？平台将向用户推送您的律师信息和联系方式。')) {
        markContacted(caseId);
        btn.textContent = '已联系';
        btn.classList.add('contacted');
        btn.disabled = true;
        alert('已向用户发送联系请求！用户将在案件管理中看到您的信息。');
      }
    }
