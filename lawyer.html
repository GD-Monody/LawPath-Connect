    .page-header {
    background: #fff;

    }

    .page-header h2 {
    font-size: 24px;

    }

    .page-header p {
    font-size: 14px;
    color: #999;
    }

    /* ===== 搜索和筛选区 ===== */
    .filter-bar {
    background: #fff;
    padding: 20px 60px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid #f0f0f0;
    }

    .filter-bar select {
    padding: 8px 16px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
    color: #333;
    background: #fff;
    cursor: pointer;
    }

    .filter-bar select:focus {
    border-color: #1a3a5c;
    outline: none;
    }

    /* ===== 律师卡片网格 ===== */
    .lawyer-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    padding: 40px 60px;
    max-width: 1200px;
    }

    /* ===== 单张律师卡片 ===== */
    .lawyer-card {
    background: #fff;
    border-radius: 8px;
    padding: 28px 24px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    }

    .lawyer-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    /* 头像 + 姓名横排 */
    .lawyer-card .card-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    }

    .lawyer-card .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1a3a5c;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    }

    .lawyer-card .name {
    font-size: 18px;
    font-weight: bold;
    color: #1a3a5c;
    }

    .lawyer-card .title {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
    }

    /* 擅长领域标签 */
    .lawyer-card .tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    }

    .lawyer-card .tag {
    background: #eef3f8;
    color: #2d6a9f;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    }

    /* 简介 */
    .lawyer-card .desc {
    font-size: 13px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 16px;
    }

    /* 底部信息：年限 + 评分 */
    .lawyer-card .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #999;
    border-top: 1px solid #f0f0f0;
    padding-top: 14px;
    }

    .lawyer-card .rating {
    color: #e8a838;
    font-weight: bold;
    }

    @media (max-width: 768px) {
      .page-header {
        padding: 20px 16px;
      }
      .page-header h2 {
        font-size: 20px;
      }

      }

        font-size: 13px;
        padding: 8px 10px;
      }
      .lawyer-grid {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 20px 16px;
        max-width: 100%;
      }
      .lawyer-card {
        padding: 20px 16px;
      }

  // ========== 渲染律师卡片 ==========
  function renderLawyers(lawyers) {
    var grid = document.getElementById('lawyer-grid');
    var html = '';
    lawyers.forEach(function(l) {
      var starsHtml = '';
      for (var i = 0; i < Math.floor(l.rating); i++) { starsHtml += '⭐'; }
      html +=
        '<a href="lawyer-detail.html?id=' + l.id + '" style="text-decoration:none;color:inherit;">' +
          '<div class="lawyer-card">' +
            '<div class="card-top">' +
              '<div class="avatar">' + l.surname + '</div>' +
              '<div>' +
                '<div class="name">' + l.name + '</div>' +
                '<div class="title">' + l.title + ' · ' + l.firm + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="tags">' +
              l.tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('') +
            '</div>' +
            '<div class="desc">' + l.desc + '</div>' +
            '<div class="card-footer">' +
              '<span>执业 ' + l.years + ' 年</span>' +
              '<span class="rating">⭐ ' + l.rating + '</span>' +
            '</div>' +
          '</div>' +
        '</a>';
    });
    grid.innerHTML = html;
  }

  // ========== 筛选功能 ==========
  function filterLawyers() {
    var areaSelect = document.getElementById('filter-area');
    var fieldSelect = document.getElementById('filter-field');
    var yearsSelect = document.getElementById('filter-years');

    var area = areaSelect ? areaSelect.value : '';
    var field = fieldSelect ? fieldSelect.value : '';
    var years = yearsSelect ? yearsSelect.value : '';

    var filtered = allLawyers.filter(function(l) {
      if (area && area !== '全部地区' && l.city !== area) return false;
      if (field && field !== '全部领域') {
        var matchField = false;
        l.tags.forEach(function(t) { if (t === field) matchField = true; });
        if (!matchField) return false;
      }
      if (years === '3年以下' && l.years >= 3) return false;
      if (years === '3-5年' && (l.years < 3 || l.years > 5)) return false;
      if (years === '5-10年' && (l.years < 5 || l.years > 10)) return false;
      if (years === '10年以上' && l.years < 10) return false;
      return true;
    });
    renderLawyers(filtered);
  }
